name: Grantline Terraform review (example)

on:
  pull_request:
    paths:
      - "**/*.tf"

permissions:
  contents: read

jobs:
  grantline-security-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build Grantline
        run: go build -o grantline ./cmd/grantline
      - name: Configure Grantline
        run: cp grantline.config.example.json grantline.config.json
      - name: Review Terraform diff
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEVMIND_TOKEN: ${{ secrets.DEVMIND_TOKEN }}
        run: |
          DIFF="$(git diff --unified=0 "origin/${{ github.base_ref }}"...HEAD -- '*.tf')"
          test -n "$DIFF"
          ./grantline run --task security_review --non-interactive "Review this Terraform diff and request an action only if it is strictly necessary:
          $DIFF"
